[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openplacsp-pipeline"
version = "0.1.0"
description = "Reproducible historical pipeline for Spanish public procurement data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
openplacsp-pipeline = "openplacsp_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openplacsp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
