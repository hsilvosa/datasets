[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aemps-cima-pipeline"
version = "0.1.0"
description = "Reproducible AEMPS CIMA research dataset pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.27",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
cima-pipeline = "aemps_cima.cli:main"

[project.urls]
Dataset = "https://huggingface.co/datasets/HSilvosa/aemps-cima"
Documentation = "https://cima.aemps.es/cima/resources/docs/CIMA_REST_API.pdf"

[tool.hatch.build.targets.wheel]
packages = ["src/aemps_cima"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
