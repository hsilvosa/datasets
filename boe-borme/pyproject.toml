[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "boe-borme-pipeline"
version = "0.1.0"
description = "Reproducible, resumable and append-only pipeline for the Spanish BOE and BORME open data"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=16"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
boe-borme = "boe_borme.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boe_borme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
