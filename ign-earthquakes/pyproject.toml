[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ign-earthquakes-pipeline"
version = "0.1.0"
description = "Small, reproducible extractor for the official IGN earthquake catalogue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=16", "tzdata>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
ign-earthquakes = "ign_earthquakes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ign_earthquakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
