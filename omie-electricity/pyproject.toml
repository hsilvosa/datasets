[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omie-electricity-pipeline"
version = "0.1.0"
description = "Reproducible extractor and normalizer for OMIE Iberian electricity market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=16",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
omie-electricity = "omie_electricity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omie_electricity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"
