[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "boe-borme-detailed-pipeline"
version = "0.1.0"
description = "Derived, block- and version-level detailed tables from the BOE/BORME open data release"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=16"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
boe-borme-detailed = "boe_borme_detailed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boe_borme_detailed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
