[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "entsoe-transparency-pipeline"
version = "0.1.0"
description = "Reproducible ENTSO-E prices and electricity load dataset pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.27",
  "pyarrow>=16",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
entsoe-pipeline = "entsoe_transparency.cli:main"

[project.urls]
Source = "https://transparency.entsoe.eu/"
Documentation = "https://www.entsoe.eu/data/transparency-platform/"

[tool.hatch.build.targets.wheel]
packages = ["src/entsoe_transparency"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
