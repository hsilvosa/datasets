[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spanish-cadastre-pipeline"
version = "0.1.0"
description = "Reproducible GeoParquet pipeline for Spanish Cadastre INSPIRE data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=18", "pyproj>=3.7", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
spanish-cadastre = "spanish_cadastre.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spanish_cadastre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
